<!DOCTYPE html>
<html lang="en-AU" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>単元の道 · Unit Walk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%B6%3C/text%3E%3C/svg%3E">
<style>
  /* ============================================================
     単元の道 — the Bone Sparrow walk, for Japanese. One VCE AoS
     topic at a time, five steps in a recommended order (nothing
     is ever locked):

       1 ことば   meet the unit's words and their kanji parts
       2 漢字     assemble each key kanji from its parts, in the
                  right POSITIONS (the Kanji Factory's frames)
       3 問答     simple question and answer practice, reveal
                  and self-mark, VCE general-conversation style
       4 文法     the grammar the unit leans on, deep-linked to
                  the Grammar Hub for revision
       5 クラフト  a worked example with its craft moves named,
                  then editing: choose the stronger rewrite

     Word lists are the same drafts as the Word Builder (Q6).
     Capacity colours (red sense / blue sound / purple both) are
     the suite-wide taxonomy: here they light up when a kanji is
     assembled correctly, exactly as in the Kanji Factory.
     ============================================================ */
  :root{
    --bg:#f4efe6; --paper:#fbf7ee; --ink:#1f1f1f; --muted:#6b6256;
    --line:#d8cfbb; --line-soft:#e8e0cd; --accent:#a83232;
    --correct:#2f6a3e; --wrong:#a83232; --okbg:#eef5ee; --badbg:#f7ecec;
    --band:#f5f0e6; --amber:#8a6d1e; --pos:#8d8577;
    --sense:#b5342a; --sense-bg:#fae7e4;
    --sound:#2f5d8f; --sound-bg:#e3ecf5;
    --both:#6b4a9e;  --both-bg:#ece4f6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--ink);
       line-height:1.5;min-height:100vh;padding:16px}
  .wrap{max-width:1000px;margin:0 auto}
  .container{background:var(--paper);border:1px solid var(--line);border-radius:12px;
       padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  h1{text-align:center;font-size:22px;font-family:Georgia,'Times New Roman',serif;letter-spacing:.5px}
  h2{font-family:Georgia,serif;font-size:17px;margin:0 0 4px}
  .subtitle{color:var(--muted);text-align:center;margin:6px 0 4px;font-size:13px}
  .poc{display:block;text-align:center;font-size:11px;color:var(--muted);margin-bottom:14px}
  .poc b{color:var(--accent)}
  .screen{display:none}.screen.active{display:block}
  button{font-family:inherit}
  .btn{padding:10px 17px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;
       cursor:pointer;background:var(--paper);color:var(--ink)}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-ghost{background:var(--bg);color:var(--muted)}
  .btn:disabled{opacity:.45;cursor:default}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 8px}
  .navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .intro{font-size:13.5px;color:var(--muted);margin:2px 0 14px;text-align:center}

  /* ---- home: theme groups and unit cards ---- */
  .themehead{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
       color:var(--muted);margin:18px 0 8px;border-bottom:1px solid var(--line-soft);padding-bottom:4px}
  .themehead b{color:var(--ink);font-size:14px;letter-spacing:0;text-transform:none;font-family:Georgia,serif;margin-right:8px}
  .unitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .ucard{text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--paper);
       padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
  .ucard:hover{border-color:var(--accent)}
  .ucard .ut{font-family:Georgia,serif;font-size:15.5px}
  .ucard .ub{font-size:12px;color:var(--muted)}
  .udots{display:flex;gap:5px;margin-top:2px}
  .udot{width:9px;height:9px;border-radius:50%;background:var(--line);border:1px solid var(--line)}
  .udot.on{background:var(--correct);border-color:var(--correct)}

  /* ---- unit page: the five step cards ---- */
  .uhead{text-align:center;margin-bottom:4px}
  .uhead .ut{font-family:Georgia,serif;font-size:19px}
  .uhead .utheme{font-size:11.5px;color:var(--muted)}
  .uhead .ublurb{font-size:13px;color:var(--muted);max-width:640px;margin:4px auto 0}
  .steps{display:flex;flex-direction:column;gap:8px;margin:16px 0 10px}
  .stepcard{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);
       border-radius:10px;background:var(--paper);padding:11px 14px;cursor:pointer}
  .stepcard:hover{border-color:var(--accent)}
  .stepcard .sn{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);color:var(--muted);
       display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
  .stepcard.done .sn{border-color:var(--correct);background:var(--okbg);color:var(--correct)}
  .stepcard .st{font-family:Georgia,serif;font-size:15.5px}
  .stepcard .ss{font-size:12px;color:var(--muted)}
  .stepcard .stag{margin-left:auto;font-size:11.5px;color:var(--correct);font-weight:700;white-space:nowrap}
  .walkline{display:none}
  .reportrow{text-align:center;margin-top:14px}
  pre.report{white-space:pre-wrap;text-align:left;background:var(--bg);border:1px solid var(--line);
       border-radius:8px;padding:12px 14px;font-size:12.5px;margin:10px 0}

  /* ---- generic step chrome ---- */
  .stephead{text-align:center;margin-bottom:12px}
  .stephead .sh{font-family:Georgia,serif;font-size:18px}
  .stephead .shs{font-size:12.5px;color:var(--muted)}
  .stepfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
  .prog{font-size:12px;color:var(--muted);font-weight:700}

  /* ---- step 1: study table ---- */
  .wtable{display:flex;flex-direction:column;gap:8px}
  .wrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line-soft);border-radius:10px;
       background:var(--paper);padding:9px 12px}
  .wrow .wk{font-family:Georgia,serif;font-size:27px;min-width:96px;text-align:center}
  .wrow .wr{font-size:12.5px;color:var(--muted);min-width:86px;text-align:center}
  .wrow .wdef{font-size:12.5px;color:var(--muted);flex:1}
  .wrow .wparts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .pchip{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:8px;
       padding:3px 8px;background:var(--bg);min-width:44px}
  .pchip .pk{font-family:Georgia,serif;font-size:17px;line-height:1.2}
  .pchip .pg{font-size:8.5px;color:var(--muted);white-space:nowrap}
  body.hidehelp .wr,body.hidehelp .wdef{visibility:hidden}
  .studytools{text-align:center;margin:0 0 12px}

  /* ---- step 2: build queue + workbench (Kanji Factory frames) ---- */
  .queue{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
  .qcard{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:10px;
       background:var(--paper);padding:7px 12px;cursor:pointer;min-width:84px}
  .qcard:hover{border-color:var(--accent)}
  .qcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(168,50,50,.18)}
  .qcard.built{border-color:var(--correct);background:var(--okbg);cursor:default}
  .qcard .qw{font-family:Georgia,serif;font-size:19px}
  .qcard .qw .gap{color:var(--accent);font-weight:700}
  .qcard.built .qw .gap{color:var(--correct)}
  .qcard .qg{font-size:10px;color:var(--muted)}
  .qcard .qtick{font-size:11px;font-weight:800;color:var(--correct);min-height:15px}
  .bench{border:1px solid var(--line-soft);border-radius:12px;background:var(--band);padding:16px 14px 14px;margin-bottom:8px}
  .prompt{text-align:center;font-size:14px;margin-bottom:2px}
  .prompt b{font-family:Georgia,serif;font-size:17px}
  .promptread{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px;min-height:19px}
  .frame{display:grid;gap:8px;justify-content:center;margin-bottom:6px;padding-top:12px}
  .frame.lr{grid-template-columns:96px 96px}
  .frame.tb{grid-template-columns:110px}
  .frame.tb .slot.top{height:64px;font-size:34px}
  .frame.kamae{grid-template-columns:150px;position:relative}
  .frame.nyou{grid-template-columns:150px;position:relative}
  .slot{height:96px;border:2px dashed var(--line);border-radius:12px;background:var(--bg);
       display:grid;place-items:center;font-family:Georgia,serif;font-size:44px;color:var(--ink);
       position:relative;transition:border-color .15s,background .3s,color .3s}
  .frame.kamae .slot.outer{height:150px;place-items:start center;padding-top:10px}
  .frame.kamae .slot.inner{position:absolute;left:50%;top:62px;transform:translateX(-50%);
       width:78px;height:74px;font-size:34px;z-index:2;background:var(--paper)}
  .frame.nyou .slot.outer{height:150px;place-items:end start;padding:0 0 8px 10px}
  .frame.nyou .slot.inner{position:absolute;right:8px;top:20px;width:84px;height:80px;
       font-size:34px;z-index:2;background:var(--paper)}
  .slot.over{border-color:var(--accent);background:#faf5f0}
  .slot .slotlab{position:absolute;bottom:4px;left:0;right:0;text-align:center;
       font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--pos);text-transform:uppercase}
  .frame.nyou .slot.outer .slotlab{text-align:left;padding-left:10px}
  .slot.filled{border-style:solid;cursor:pointer}
  .slot.lit-sense{border-color:var(--sense);background:var(--sense-bg);color:var(--sense);animation:pop .45s ease-out}
  .slot.lit-sound{border-color:var(--sound);background:var(--sound-bg);color:var(--sound);animation:pop .45s ease-out}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}
  .rolebadge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;
       letter-spacing:.06em;padding:1px 8px;border-radius:9px;text-transform:uppercase;white-space:nowrap;z-index:3}
  .rb-sense{background:var(--sense);color:#fff}
  .rb-sound{background:var(--sound);color:#fff}
  .frame.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .builtline{text-align:center;font-size:13px;color:var(--correct);font-weight:700;min-height:20px;margin:6px 0 2px}
  .hookline{text-align:center;font-size:12.5px;color:var(--muted);max-width:560px;margin:0 auto 6px;min-height:0}
  .bankhead{font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--muted);
       text-transform:uppercase;text-align:center;margin:14px 0 8px}
  .bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .piece{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--paper);
       border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:grab;min-width:62px}
  .piece:hover{border-color:var(--accent)}
  .piece.used{opacity:.28;pointer-events:none}
  .piece.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(168,50,50,.18)}
  .piece .pc{font-family:Georgia,serif;font-size:27px;line-height:1.1}
  .piece .pg{font-size:9.5px;color:var(--muted);font-weight:600}
  .piece .pn{font-size:8.5px;color:var(--pos)}
  .piece.dragging{opacity:.4}

  /* ---- step 3: QA ---- */
  .qabox{border:1px solid var(--line-soft);border-radius:12px;background:var(--paper);padding:18px 16px;max-width:640px;margin:0 auto}
  .qaq{margin-bottom:12px}
  .jp{font-family:Georgia,serif;font-size:19px;line-height:1.7}
  .jp .sub{display:block;font-family:'Segoe UI',sans-serif;font-size:12.5px;color:var(--muted)}
  .qalab{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .qaa{border-top:1px dashed var(--line);padding-top:12px;margin-top:6px}
  .qatip{font-size:12.5px;color:var(--amber);margin-top:8px}
  .qamarks{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .qadonep{text-align:center;padding:20px 0}
  .qadonep .big{font-size:34px}

  /* ---- step 4: grammar ---- */
  .gramrows{display:flex;flex-direction:column;gap:10px;max-width:680px;margin:0 auto}
  .gramrow{border:1px solid var(--line-soft);border-radius:10px;background:var(--paper);padding:12px 14px;
       display:flex;gap:12px;align-items:flex-start}
  .gramrow .gt{font-weight:700;font-size:14px}
  .gramrow .gw{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
  .gramrow .gtick{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--line);
       background:var(--bg);cursor:pointer;font-size:14px;color:var(--correct);font-weight:800;line-height:1}
  .gramrow.ok .gtick{border-color:var(--correct);background:var(--okbg)}
  .hublink{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);
       border-radius:7px;padding:4px 10px;display:inline-block;background:var(--bg)}
  .hublink:hover{border-color:var(--accent)}

  /* ---- step 5: craft ---- */
  .craftintro{font-size:13px;color:var(--muted);text-align:center;max-width:620px;margin:0 auto 14px}
  .model{max-width:680px;margin:0 auto 20px;display:flex;flex-direction:column;gap:9px}
  .msent{border:1px solid var(--line-soft);border-radius:10px;background:var(--paper);padding:10px 14px;position:relative}
  .msent .move{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
       color:#fff;background:var(--amber);border-radius:8px;padding:1px 8px;margin-bottom:4px}
  .edits{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .edit{border:1px solid var(--line-soft);border-radius:10px;background:var(--paper);padding:14px}
  .edit .weaklab{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--wrong);margin-bottom:3px}
  .edit .opts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .optbtn{text-align:left;font-family:Georgia,serif;font-size:15.5px;padding:9px 12px;border:1px solid var(--line);
       border-radius:8px;background:var(--bg);cursor:pointer}
  .optbtn:hover{border-color:var(--accent)}
  .optbtn.good{border-color:var(--correct);background:var(--okbg);color:var(--correct)}
  .optbtn.bad{border-color:var(--wrong);background:var(--badbg);animation:shake .4s}
  .edit .why{font-size:12.5px;color:var(--muted);margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}

  .payoff{max-width:620px;margin:16px auto 0;border:1px solid var(--line);border-left:4px solid var(--correct);
       border-radius:8px;background:var(--okbg);padding:12px 16px;font-size:13.5px}
  .buildtag{margin-top:18px;font-size:10px;color:var(--muted);opacity:.7}
  @media (max-width:640px){
    .wrow{flex-wrap:wrap}.wrow .wparts{justify-content:flex-start}
    .frame.lr{grid-template-columns:80px 80px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="container">
    <h1 class="jt-tap" data-jt="title">単元の道</h1>
    <p class="subtitle jt-tap" data-jt="subtitle">One VCE topic, five steps, walked in order</p>
    <span class="poc"><b>PoC.</b> Word lists, questions and models are drafts for Andrew to correct, not settled curriculum (Q19).</span>

    <!-- ============ HOME ============ -->
    <section id="scr-home" class="screen active">
      <p class="intro jt-tap" data-jt="how">Pick a topic.</p>
      <div id="themes"></div>
    </section>

    <!-- ============ UNIT PAGE ============ -->
    <section id="scr-unit" class="screen">
      <div class="navrow"><button class="linkbtn" data-go="home" data-jt="back">← ホーム</button><span></span></div>
      <div class="uhead" id="unit-head"></div>
      <div class="steps" id="steps"></div>
      <div class="reportrow" id="report-row"></div>
    </section>

    <!-- ============ STEP 1 STUDY ============ -->
    <section id="scr-study" class="screen">
      <div class="navrow"><button class="linkbtn" data-go="unit" data-jt="backunit">← 単元</button>
        <span id="studyLever" data-scope="#scr-study"></span></div>
      <div class="stephead" id="study-head"></div>
      <div class="studytools"><button class="btn btn-ghost" id="hideBtn"></button></div>
      <div class="wtable" id="study-table"></div>
      <div class="stepfoot"><span class="prog" id="study-prog"></span>
        <button class="btn btn-primary" id="study-next"></button></div>
    </section>

    <!-- ============ STEP 2 BUILD ============ -->
    <section id="scr-build" class="screen">
      <div class="navrow"><button class="linkbtn" data-go="unit" data-jt="backunit">← 単元</button>
        <span id="buildLever" data-scope="#scr-build"></span></div>
      <div class="stephead" id="build-head"></div>
      <div class="queue" id="queue"></div>
      <div class="bench" id="bench"></div>
      <div class="stepfoot"><span class="prog" id="build-prog"></span>
        <button class="btn btn-primary" id="build-next" style="display:none"></button></div>
    </section>

    <!-- ============ STEP 3 QA ============ -->
    <section id="scr-qa" class="screen">
      <div class="navrow"><button class="linkbtn" data-go="unit" data-jt="backunit">← 単元</button>
        <span id="qaLever" data-scope="#scr-qa"></span></div>
      <div class="stephead" id="qa-head"></div>
      <div id="qa-area"></div>
      <div class="stepfoot"><span class="prog" id="qa-prog"></span><span></span></div>
    </section>

    <!-- ============ STEP 4 GRAMMAR ============ -->
    <section id="scr-gram" class="screen">
      <div class="navrow"><button class="linkbtn" data-go="unit" data-jt="backunit">← 単元</button></div>
      <div class="stephead" id="gram-head"></div>
      <div class="gramrows" id="gram-rows"></div>
      <div class="stepfoot"><span class="prog" id="gram-prog"></span>
        <button class="btn btn-primary" id="gram-next"></button></div>
    </section>

    <!-- ============ STEP 5 CRAFT ============ -->
    <section id="scr-craft" class="screen">
      <div class="navrow"><button class="linkbtn" data-go="unit" data-jt="backunit">← 単元</button>
        <span id="craftLever" data-scope="#scr-craft"></span></div>
      <div class="stephead" id="craft-head"></div>
      <p class="craftintro" id="craft-intro"></p>
      <div class="model" id="craft-model"></div>
      <div class="stephead"><div class="sh" id="craft-edith"></div>
        <div class="shs">One is genuinely better. The other two are flat, or hide a common error.</div></div>
      <div class="edits" id="craft-edits"></div>
      <div id="craft-payoff"></div>
      <div class="stepfoot"><span class="prog" id="craft-prog"></span><span></span></div>
    </section>

    <div class="buildtag">単元の道 build 2026-08-19 · PoC</div>
  </div>
</div>

<script src="lever.js"></script>
<script>
"use strict";
/* ============================================================
   DATA — word lists and the kanji gloss dictionary are spliced
   verbatim from the Word Builder so the two apps can never drift
   apart (one draft, two views of it). QA and craft content per
   unit lives in CONTENT. BUILDS and GMAP are hand-authored.
   ============================================================ */

const KANJI = {
  "名":{g:"name",r:"な・メイ",cap:"sense"},
  "前":{g:"front, before",r:"まえ・ゼン",cap:"sense"},
  "年":{g:"year",r:"とし・ネン",cap:"sense"},
  "齢":{g:"age, years",r:"レイ",cap:"sense"},
  "住":{g:"to reside, dwell",r:"す(む)・ジュウ",cap:"sense"},
  "所":{g:"place",r:"ところ・ショ",cap:"sense"},
  "誕":{g:"birth",r:"タン",cap:"sense"},
  "生":{g:"life, to live, to be born",r:"い(きる)・セイ",cap:"both"},
  "日":{g:"day, sun",r:"ひ・ニチ",cap:"sense"},
  "毎":{g:"every",r:"マイ",cap:"both"},
  "活":{g:"lively, activity",r:"カツ",cap:"sense"},
  "近":{g:"near, close",r:"ちか(い)・キン",cap:"sense"},
  "健":{g:"healthy, robust",r:"すこ(やか)・ケン",cap:"sense"},
  "康":{g:"peace, ease",r:"コウ",cap:"sense"},
  "自":{g:"self",r:"みずか(ら)・ジ",cap:"sense"},
  "由":{g:"reason, cause",r:"よし・ユウ",cap:"sense"},
  "転":{g:"to roll, turn",r:"ころ(がる)・テン",cap:"sense"},
  "車":{g:"car, vehicle",r:"くるま・シャ",cap:"sense"},
  "週":{g:"week",r:"シュウ",cap:"sense"},
  "末":{g:"end",r:"すえ・マツ",cap:"sense"},
  "運":{g:"to carry, luck",r:"はこ(ぶ)・ウン",cap:"sense"},
  "動":{g:"to move",r:"うご(く)・ドウ",cap:"both"},
  "家":{g:"house, specialist",r:"いえ・カ",cap:"sense"},
  "族":{g:"group, tribe",r:"ゾク",cap:"sense"},
  "庭":{g:"garden, courtyard",r:"にわ・テイ",cap:"sense"},

    '<div class="ublurb">'+esc(u.blurb)+'</div>';
  $("steps").innerHTML=STEPS.map((st,i)=>
    '<button class="stepcard'+(d[st.k]?" done":"")+'" data-step="'+st.k+'">'+
      '<span class="sn">'+(d[st.k]?"✓":i+1)+'</span>'+
      '<span><span class="st">'+esc(tF(st.t))+'</span><br><span class="ss">'+esc(tF(st.s))+'</span></span>'+
      '<span class="stag">'+esc(stepTag(st.k))+'</span>'+
    '</button>').join("");
  $("steps").querySelectorAll("[data-step]").forEach((b)=>{
    b.onclick=()=>{ enterStep(b.dataset.step); };
  });
  const any=STEPS.some((st)=>d[st.k]);
  $("report-row").innerHTML = any?
    '<button class="btn btn-ghost" id="repBtn">通信簿 · report</button><div id="rep-out"></div>':"";
  if (any) $("repBtn").onclick=showReport;
}
function showReport(){
  const u=unit(), d=doneOf(u.key);
  const lines=["単元の道 · "+u.title, u.themeJa+" · "+u.topic, ""];
  const bAll=BUILDS[u.key], bGot=bAll.filter((b)=>S.built[u.key+":"+b.ch]).length,
        bFt=bAll.filter((b)=>S.first["b:"+u.key+":"+b.ch]===true).length;
  const q=S.qa[u.key]||{marks:{}}, marks=Object.values(q.marks),
        maru=marks.filter((m)=>m==="maru").length;
  const eAll=content(u.key).craft.edits,
        eGot=eAll.filter((e,i)=>S.edits[u.key+":"+i]).length,
        eFt=eAll.filter((e,i)=>S.first["e:"+u.key+":"+i]===true).length;
  lines.push("1 ことば  studied: "+(d.study?"yes":"not yet"));
  lines.push("2 漢字   built: "+bGot+"/"+bAll.length+" (first try "+bFt+")");
  lines.push("3 問答   answered: "+marks.length+"/"+content(u.key).qa.length+" (○ "+maru+")");
  lines.push("4 文法   ticked: "+GMAP[u.key].filter((g)=>S.gram[u.key+":"+g.id]).length+"/"+GMAP[u.key].length);
  lines.push("5 クラフト edits: "+eGot+"/"+eAll.length+" (first try "+eFt+")");
  const txt=lines.join("\n");
  $("rep-out").innerHTML='<pre class="report">'+esc(txt)+'</pre>'+
    '<button class="btn btn-ghost" id="copyBtn">copy</button>';
  $("copyBtn").onclick=()=>{
    if (navigator.clipboard) navigator.clipboard.writeText(txt);
    $("copyBtn").textContent="copied ✓";
  };
}
function enterStep(k){
  if (k==="qa" && !S.qa[S.unit]) S.qa[S.unit]={i:0,revealed:false,marks:{}};
  if (k==="build" && (B.unit!==S.unit)) { B.unit=S.unit; B.ch=null; B.placed={}; B.sel=null; }
  go(k);
}
function stepHead(el,k){
  const st=STEPS.find((s)=>s.k===k);
  $(el).innerHTML='<div class="sh">'+esc(tF(st.t))+'</div><div class="shs">'+esc(unit().title)+'</div>';
}

/* ---------------- STEP 1 · STUDY ---------------- */
function paintStudy(){
  const u=unit();
  stepHead("study-head","study");
  document.body.classList.toggle("hidehelp",S.hide);
  $("hideBtn").textContent=S.hide?"見せて · show the help":"かくして · hide the help and self-test";
  $("study-table").innerHTML=u.words.map((w)=>
    '<div class="wrow"><span class="wk">'+esc(w.w)+'</span><span class="wr">'+esc(w.r)+'</span>'+
    '<span class="wdef">'+esc(w.def)+'</span>'+
    '<span class="wparts">'+w.parts.map((p)=>{
      const k=KANJI[p]||{};
      return '<span class="pchip"><span class="pk">'+esc(p)+'</span><span class="pg">'+esc(k.g||"")+'</span></span>';
    }).join("")+'</span></div>').join("");
  $("study-prog").textContent=u.words.length+" words · every kanji part labelled";
  $("study-next").textContent="つぎへ · I know these, walk on →";
  $("study-next").onclick=()=>{ doneOf(u.key).study=true; enterStep("build"); };
  $("hideBtn").onclick=()=>{ S.hide=!S.hide; paintStudy(); };
}

/* ---------------- STEP 2 · BUILD (Factory frames) ---------------- */
const B={unit:null,ch:null,placed:{},sel:null};
function bankParts(key){
  const seen=[],out=[];
  BUILDS[key].forEach((b)=>b.parts.forEach((pt)=>{
    if(!seen.includes(pt.p)){seen.push(pt.p);out.push(pt.p);}
  }));
  return out;
}
function paintBuild(){
  const u=unit(), builds=BUILDS[u.key];
  stepHead("build-head","build");
  /* the queue: any order, like the Word Builder */
  $("queue").innerHTML=builds.map((b)=>{
    const done=S.built[u.key+":"+b.ch];
    const wordHtml=esc(b.word).split("").map((c)=>
      c===b.ch?'<span class="gap">'+(done?esc(b.ch):"▢")+'</span>':c).join("");
    return '<button class="qcard'+(done?" built":"")+(B.ch===b.ch?" sel":"")+'" data-ch="'+esc(b.ch)+'">'+
      '<span class="qtick">'+(done?"✓":"")+'</span>'+
      '<span class="qw">'+wordHtml+'</span>'+
      '<span class="qg">'+esc(b.gloss)+'</span></button>';
  }).join("");
  $("queue").querySelectorAll("[data-ch]").forEach((c)=>{
    c.onclick=()=>{ if(S.built[u.key+":"+c.dataset.ch])return;
      B.ch=c.dataset.ch; B.placed={}; B.sel=null; paintBuild(); };
  });
  const got=builds.filter((b)=>S.built[u.key+":"+b.ch]).length;
  $("build-prog").textContent=got+"/"+builds.length+" built";
  const allDone=got===builds.length;
  $("build-next").style.display=allDone?"":"none";
  if(allDone){ doneOf(u.key).build=true;
    $("build-next").textContent="つぎへ · walk on →";
    $("build-next").onclick=()=>enterStep("qa"); }
  if(!B.ch){ const nxt=builds.find((b)=>!S.built[u.key+":"+b.ch]);
    if(nxt&&!allDone){B.ch=nxt.ch;} }
  paintBench();
}
function slotLab(pos,i){
  if(pos==="lr")return i===0?"ひだり left":"みぎ right";
  if(pos==="tb")return i===0?"うえ top":"した bottom";
  return i===0?"そと outside":"なか inside";
}
function paintBench(){
  const u=unit(), b=BUILDS[u.key].find((x)=>x.ch===B.ch);
  if(!b){ $("bench").innerHTML='<p class="intro">ぜんぶできた！ All built.</p>'; return; }
  const done=false;
  const slotCls=(i)=>{
    if(b.pos==="kamae"||b.pos==="nyou")return i===0?"outer":"inner";
    if(b.pos==="tb")return i===0?"top":"bottom";
    return "";
  };
  $("bench").innerHTML=
    '<div class="prompt">つくって: <b>'+esc(b.gloss)+'</b> · as in '+esc(b.word)+'</div>'+
    '<div class="promptread" id="bench-read"></div>'+
    '<div class="frame '+b.pos+'" id="frame">'+
      b.parts.map((pt,i)=>'<div class="slot '+slotCls(i)+'" data-slot="'+i+'">'+
        '<span class="slotlab">'+slotLab(b.pos,i)+'</span></div>').join("")+
    '</div>'+
    '<div class="builtline" id="builtline"></div>'+
    '<div class="hookline" id="hookline"></div>'+
    '<div class="bankhead">部品 · the parts (drag, or tap then tap)</div>'+
    '<div class="bank" id="bank">'+bankParts(u.key).map((p)=>{
      const info=PARTS[p]||{g:"",n:""};
      return '<button class="piece" data-p="'+esc(p)+'" draggable="true">'+
        '<span class="pc">'+esc(p)+'</span><span class="pg">'+esc(info.g)+'</span>'+
        (info.n?'<span class="pn">'+esc(info.n)+'</span>':"")+'</button>';
    }).join("")+'</div>';
  wireBench(b);
}
function wireBench(b){
  const u=unit();
  const slots=[...$("frame").querySelectorAll(".slot")];
  const pieces=[...$("bank").querySelectorAll(".piece")];
  const usedParts=()=>Object.values(B.placed);
  const refresh=()=>{
    slots.forEach((s)=>{
      const i=s.dataset.slot, p=B.placed[i];
      s.classList.toggle("filled",!!p);
      s.childNodes.forEach(()=>{});
      s.innerHTML='<span class="slotlab">'+slotLab(b.pos,+i)+'</span>'+(p?esc(p):"");
    });
    pieces.forEach((pc)=>{
      pc.classList.toggle("used",usedParts().includes(pc.dataset.p));
      pc.classList.toggle("sel",B.sel===pc.dataset.p);
    });
  };
  const drop=(i,p)=>{
    if(usedParts().includes(p))return;
    B.placed[i]=p; B.sel=null; refresh(); judge();
  };
  const judge=()=>{
    if(Object.keys(B.placed).length!==b.parts.length)return;
    const right=b.parts.every((pt,i)=>B.placed[i]===pt.p);
    const id="b:"+u.key+":"+b.ch;
    if(right){
      firstTry(id,true);
      slots.forEach((s,i)=>{
        const role=b.parts[i].role;
        s.classList.add("lit-"+role);
        s.insertAdjacentHTML("beforeend",'<span class="rolebadge rb-'+role+'">'+
          (role==="sound"?"おと sound"+(b.parts[i].sound?" "+esc(b.parts[i].sound):""):"いみ meaning")+'</span>');
      });
      $("bench-read").textContent=b.ch+" · "+b.read;
      $("builtline").textContent="できた！ "+b.ch;
      $("hookline").textContent=b.hook;
      S.built[u.key+":"+b.ch]=true;
      setTimeout(()=>{ B.ch=null; B.placed={}; paintBuild(); },2600);
    }else{
      firstTry(id,false);
      $("frame").classList.add("shake");
      setTimeout(()=>{ B.placed={}; paintBench(); },450);
    }
  };
  slots.forEach((s)=>{
    s.ondragover=(e)=>{e.preventDefault();s.classList.add("over");};
    s.ondragleave=()=>s.classList.remove("over");
    s.ondrop=(e)=>{e.preventDefault();s.classList.remove("over");
      const p=e.dataTransfer.getData("text/plain"); if(p)drop(s.dataset.slot,p);};
    s.onclick=()=>{
      const i=s.dataset.slot;
      if(B.sel){drop(i,B.sel);return;}
      if(B.placed[i]){delete B.placed[i];refresh();}
    };
  });
  pieces.forEach((pc)=>{
    pc.ondragstart=(e)=>{e.dataTransfer.setData("text/plain",pc.dataset.p);pc.classList.add("dragging");};
    pc.ondragend=()=>pc.classList.remove("dragging");
    pc.onclick=()=>{B.sel=B.sel===pc.dataset.p?null:pc.dataset.p;refresh();};
  });
  refresh();
}

/* ---------------- STEP 3 · QA ---------------- */
function paintQa(){
  const u=unit(), qa=content(u.key).qa, q=S.qa[u.key];
  stepHead("qa-head","qa");
  const done=Object.keys(q.marks).length;
  $("qa-prog").textContent=done+"/"+qa.length;
  if(q.i>=qa.length){
    doneOf(u.key).qa=true;
    const maru=Object.values(q.marks).filter((m)=>m==="maru").length;
    $("qa-area").innerHTML='<div class="qabox qadonep"><div class="big">'+
      (maru===qa.length?"◎":"○")+'</div>'+
      '<p>'+maru+' of '+qa.length+' felt solid. '+
      (maru<qa.length?'The △ ones are the ones to ask again tomorrow.':'Ask them again tomorrow anyway; that is how they stick.')+'</p>'+
      '<p style="margin-top:10px"><button class="btn btn-ghost" id="qa-again">もういちど · run them again</button> '+
      '<button class="btn btn-primary" id="qa-on">つぎへ · walk on →</button></p></div>';
    $("qa-again").onclick=()=>{ S.qa[u.key]={i:0,revealed:false,marks:{}}; paintQa(); };
    $("qa-on").onclick=()=>enterStep("gram");
    return;
  }
  const item=qa[q.i];
  $("qa-area").innerHTML='<div class="qabox">'+
    '<div class="qaq"><div class="qalab">しつもん · question '+(q.i+1)+'/'+qa.length+'</div>'+jpBlock(item.q)+'</div>'+
    (q.revealed?
      '<div class="qaa"><div class="qalab">モデルのこたえ · one good answer</div>'+jpBlock(item.a)+
      '<div class="qatip">'+esc(item.tip)+'</div>'+
      '<div class="qamarks"><button class="btn" id="qa-maru">○ こたえられた · I had it</button>'+
      '<button class="btn btn-ghost" id="qa-later">△ まだ · not yet</button></div></div>'
      :
      '<p class="intro" style="margin:0 0 10px">Say your answer out loud, or in your head. Then check.</p>'+
      '<p style="text-align:center"><button class="btn btn-primary" id="qa-reveal">見せて · show a good answer</button></p>')+
    '</div>';
  if(q.revealed){
    const mark=(m)=>{ q.marks[q.i]=m; q.i++; q.revealed=false; paintQa(); };
    $("qa-maru").onclick=()=>mark("maru");
    $("qa-later").onclick=()=>mark("later");
  }else{
    $("qa-reveal").onclick=()=>{ q.revealed=true; paintQa(); };
  }
}

/* ---------------- STEP 4 · GRAMMAR ---------------- */
function paintGram(){
  const u=unit(), rows=GMAP[u.key];
  stepHead("gram-head","gram");
  $("gram-rows").innerHTML=
    '<p class="intro" style="margin-bottom:2px">This unit stands on three patterns. If one feels shaky, the link drops you on its exact shelf in the Grammar Hub. Tick what you are sure of.</p>'+
    rows.map((g)=>{
      const ok=S.gram[u.key+":"+g.id];
      return '<div class="gramrow'+(ok?" ok":"")+'">'+
        '<button class="gtick" data-g="'+esc(g.id)+'">'+(ok?"✓":"")+'</button>'+
        '<div><div class="gt">'+esc(g.label)+'</div><div class="gw">'+esc(g.why)+'</div>'+
        '<a class="hublink" href="../grammar/#'+esc(g.id)+'" target="_blank" rel="noopener">文法ホームで練習 · revise in the Grammar Hub →</a></div></div>';
    }).join("");
  $("gram-rows").querySelectorAll("[data-g]").forEach((b)=>{
    b.onclick=()=>{ const k=u.key+":"+b.dataset.g; S.gram[k]=!S.gram[k];
      if(rows.every((g)=>S.gram[u.key+":"+g.id])) doneOf(u.key).gram=true;
      paintGram(); };
  });
  const n=rows.filter((g)=>S.gram[u.key+":"+g.id]).length;
  $("gram-prog").textContent=n+"/"+rows.length+" ticked";
  $("gram-next").textContent="つぎへ · walk on →";
  $("gram-next").onclick=()=>{ enterStep("craft"); };
}

/* ---------------- STEP 5 · CRAFT ---------------- */
function paintCraft(){
  const u=unit(), c=content(u.key).craft;
  stepHead("craft-head","craft");
  $("craft-intro").textContent=c.intro;
  $("craft-model").innerHTML=c.model.map((m)=>
    '<div class="msent">'+(m.note?'<span class="move">'+esc(m.note)+'</span><br>':"")+jpBlock(m.jp)+'</div>').join("");
  $("craft-edith").textContent="なおして · now edit: pick the stronger rewrite";
  $("craft-edits").innerHTML=c.edits.map((e,i)=>{
    const got=S.edits[u.key+":"+i];
    return '<div class="edit" data-e="'+i+'">'+
      '<div class="weaklab">よわい文 · a flat draft</div>'+jpBlock(e.weak)+
      '<div class="opts">'+e.options.map((o,j)=>
        '<button class="optbtn'+(got&&j===e.answer?" good":"")+'" data-o="'+j+'" '+(got?"disabled":"")+'>'+esc(o)+'</button>').join("")+'</div>'+
      (got?'<div class="why">'+esc(e.why)+'</div>':"")+
      '</div>';
  }).join("");
  $("craft-edits").querySelectorAll(".edit").forEach((box)=>{
    const i=+box.dataset.e, e=c.edits[i];
    box.querySelectorAll(".optbtn").forEach((ob)=>{
      ob.onclick=()=>{
        const j=+ob.dataset.o, id="e:"+u.key+":"+i;
        if(j===e.answer){ firstTry(id,true); S.edits[u.key+":"+i]=true;
          if(c.edits.every((x,k)=>S.edits[u.key+":"+k])) doneOf(u.key).craft=true;
          paintCraft();
        }else{ firstTry(id,false); ob.classList.add("bad"); ob.disabled=true; }
      };
    });
  });
  const got=c.edits.filter((e,i)=>S.edits[u.key+":"+i]).length;
  $("craft-prog").textContent=got+"/"+c.edits.length+" edits";
  $("craft-payoff").innerHTML = got===c.edits.length?
    '<div class="payoff">この単元、あるいた。You walked the whole unit: words, kanji, talk, grammar, craft. '+
    'The report on the unit page shows the walk. あしたも、もういちど。</div>':"";
}

/* ---------------- boot ---------------- */
document.querySelectorAll("[data-go]").forEach((b)=>{
  b.addEventListener("click",()=>go(b.dataset.go));
});
window.HubLever.init({ strings:UI, ruby:UI_RUBY, onChange:()=>paint() });
paint();
</script>
