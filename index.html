<!DOCTYPE html>
<html lang="en-AU" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Never let the browser offer to translate this page. A student one-clicking
     Google Translate would turn every Japanese item into English and destroy
     the exercise. Same rule as the EAL vocabulary drill. -->
<meta name="google" content="notranslate">
<title>Japanese Grammar Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%88%B7%3C/text%3E%3C/svg%3E">
<style>
  /* Palette deliberately matches the Aussie Phonics Trainer so the two
     tools read as one suite. The signature element here is the SEQUENCE
     MATRIX on the landing screen: the whole ELC progression is visible
     at once, and a cell is the unit of practice. */
  :root{
    --bg:#f4efe6; --paper:#fbf7ee; --ink:#1f1f1f; --muted:#6b6256;
    --line:#d8cfbb; --line-soft:#e8e0cd; --accent:#a83232;
    --correct:#2f6a3e; --wrong:#a83232; --okbg:#eef5ee; --badbg:#f7ecec;

    /* ---- curriculum axis: WHICH DOCUMENT defines a band column ----
       One hue family on purpose: the correctness axis above already owns
       every colour-blind-safe warm hue (see DESIGN_RULES.md). VIC and VCE
       are separated by lightness + fill treatment + a literal word, never
       by hue. Never reuse these for correctness or for selection. */
    --vic:#2f6fa8; --vce:#16375e; --vce-ink:#fbf7ee; --prog:#6b6256;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);
       min-height:100vh;padding:16px;display:flex;justify-content:center;align-items:flex-start;color:var(--ink)}
  .container{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;
       max-width:1120px;width:100%;padding:26px;margin-top:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  /* the drill and report read better narrow; only the timeline needs the width */
  #taskScreen,#reportScreen{max-width:760px;margin:0 auto}
  h1{text-align:center;font-size:23px;font-family:Georgia,'Times New Roman',serif;letter-spacing:.5px}
  h3{font-family:Georgia,serif;font-size:15px;margin:18px 0 8px;color:var(--ink)}
  .subtitle{color:var(--muted);text-align:center;margin:6px 0 18px;font-size:13px}
  .muted{color:var(--muted);font-size:13px;line-height:1.5}
  .screen{display:none}.screen.active{display:block}
  button{font-family:inherit}

  /* ---- buttons ---- */
  .btn{padding:11px 18px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:600;
       cursor:pointer;background:var(--paper);color:var(--ink);transition:all .15s ease}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-primary:hover:not(:disabled){background:#8c2828}
  .btn-primary:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
  .btn-ghost{background:var(--bg);color:var(--muted)}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink)}
  .linkbtn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:4px 8px}
  .linkbtn:hover{text-decoration:underline}
  /* ---- the language lever ----
     The chrome is Japanese-first. Pulling the lever down adds support one
     stop at a time — kanji, +kana, romaji, English — and it is ELASTIC:
     let go and it recoils back up through the stops. The page lever snaps
     back in about two seconds; a section lever relaxes over about six, long
     enough to read. Support that fades is the point: English is a glance,
     not a state. Tapping a static label bumps just that label down one
     stop, with the same slow recoil. */
  .lever{position:absolute;z-index:6;display:flex;flex-direction:column;align-items:center;
       gap:3px;user-select:none;touch-action:none}
  /* The page lever is a machine bolted to the side of the page, not a
     control hiding in a corner. It rides in the gutter beside the card,
     stays put while you scroll, and is big enough to read from across a
     classroom when it is on the board. */
  /* padding-left leaves room for the notch labels, which hang off the
     track's left edge — they belong inside the plate, not spilling onto
     the page behind it */
  .lever-page{position:fixed;top:50%;right:14px;transform:translateY(-50%);
       background:var(--paper);border:2px solid var(--line);border-radius:18px;
       padding:13px 13px 9px 50px;box-shadow:0 4px 18px rgba(0,0,0,.13);gap:6px}
  .lever-cap{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--muted);
       text-transform:uppercase;line-height:1.1;text-align:center}
  .lever-mini{position:relative;top:auto;right:auto;display:inline-flex;vertical-align:middle;margin-left:10px}
  .lever-track{position:relative;width:26px;border-radius:15px;
       background:linear-gradient(180deg,var(--bg),var(--line-soft));
       border:2px solid var(--line);box-shadow:inset 0 2px 5px rgba(0,0,0,.13)}
  .lever-page .lever-track{height:196px;width:30px}
  .lever-mini .lever-track{height:64px;width:18px;border-width:1px}
  .lever-notch{position:absolute;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;
       border-radius:50%;background:var(--line);box-shadow:inset 0 1px 1px rgba(0,0,0,.15)}
  .lever-mini .lever-notch{width:5px;height:5px}
  /* the notch the catch just dropped into gives a little ping */
  @keyframes lever-hit{
    0%{transform:translate(-50%,-50%) scale(2.1);background:var(--accent)}
    100%{transform:translate(-50%,-50%) scale(1);background:var(--line)}
  }
  .lever-notch.hit{animation:lever-hit .38s ease-out}
  /* stage labels beside the page lever's notches — the corner space says
     what each stop does instead of leaving the lever cryptic */
  .lever-notch-label{position:absolute;right:calc(100% + 11px);transform:translateY(-50%);
       font-size:11.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);white-space:nowrap;
       opacity:.5;transition:opacity .2s,color .2s;pointer-events:none}
  .lever-notch-label.on{opacity:1;color:var(--accent)}
  /* the knob: a big cartoony ball with a glint, squashes while you grab it */
  .lever-handle{position:absolute;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;
       border-radius:50%;cursor:grab;border:2px solid #7c2424;
       background:radial-gradient(circle at 32% 28%, #d96a5a, var(--accent) 55%, #7c2424);
       box-shadow:0 3px 6px rgba(0,0,0,.25), inset 0 -3px 5px rgba(0,0,0,.18);
       transition:top .45s cubic-bezier(.34,1.56,.64,1), transform .15s ease}
  .lever-page .lever-handle{width:46px;height:46px;border-width:3px;
       box-shadow:0 5px 10px rgba(0,0,0,.28), inset 0 -4px 7px rgba(0,0,0,.2)}
  .lever-handle::after{content:"";position:absolute;top:5px;left:8px;width:9px;height:6px;
       border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-25deg)}
  .lever-page .lever-handle::after{top:7px;left:11px;width:13px;height:8px}
  .lever-mini .lever-handle{width:22px;height:22px;border-width:1px}
  .lever-mini .lever-handle::after{top:3px;left:5px;width:6px;height:4px}
  /* landing wobble: squash on impact, overshoot, settle. The handle's base
     transform has to be repeated in every frame or it jumps to the corner. */
  @keyframes lever-wobble{
    0%{transform:translate(-50%,-50%) scale(1.18,.84)}
    28%{transform:translate(-50%,-50%) scale(.90,1.13)}
    52%{transform:translate(-50%,-50%) scale(1.07,.95)}
    74%{transform:translate(-50%,-50%) scale(.97,1.03)}
    100%{transform:translate(-50%,-50%) scale(1,1)}
  }
  .lever-handle.wobble{animation:lever-wobble .40s cubic-bezier(.3,.7,.4,1)}
  .lever.dragging .lever-handle{cursor:grabbing;animation:none;transition:transform .15s ease;
       transform:translate(-50%,-50%) scale(1.12,.94)}
  .lever-handle:hover,.lever:focus-visible .lever-handle{border-color:#5d1a1a;
       box-shadow:0 3px 8px rgba(0,0,0,.3), inset 0 -3px 5px rgba(0,0,0,.18)}
  .lever:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:16px}
  .lever-stage{font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--accent);
       min-height:17px;text-align:center}
  .lever-mini .lever-stage{font-size:8.5px;min-height:11px;color:var(--muted)}
  /* Narrow screens have no gutter to live in, so it comes inboard and
     shrinks rather than sitting on top of the content. */
  @media (max-width:1100px){
    .lever-page{top:12px;right:10px;transform:none;padding:9px 9px 6px 42px;border-radius:14px}
    .lever-page .lever-track{height:120px;width:24px}
    .lever-page .lever-handle{width:32px;height:32px;border-width:2px}
    .lever-page .lever-handle::after{top:5px;left:8px;width:9px;height:6px}
    .lever-notch-label{font-size:9.5px;right:calc(100% + 8px)}
    .lever-cap{display:none}
    .lever-stage{font-size:10.5px;min-height:13px}
  }
  @media (prefers-reduced-motion: reduce){
    .lever-handle{transition:none}
    .lever-handle.wobble,.lever-notch.hit{animation:none}
  }
  .jt-tap{cursor:pointer}
  .jt-tap:hover{text-decoration:underline dashed var(--line);text-underline-offset:4px}
  .jt-sub{display:block;font-size:.55em;font-weight:400;color:var(--muted);letter-spacing:.4px;margin-top:2px}
  [data-jt] rt{font-size:.5em;font-weight:400;color:var(--muted)}

  /* ---- select: filter + matrix ---- */
  .filter-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .filter-btn{border:1px solid var(--line-soft);background:var(--bg);color:var(--muted);font-size:11px;
       font-weight:600;padding:5px 12px;border-radius:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.3px}
  .filter-btn:hover{border-color:var(--accent);color:var(--accent)}
  .filter-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---- year timeline: Prep to Year 12, one row per strand ----
     The axis does the talking: year numbers with two grouped curriculum
     bars (VIC outlined, VCE filled — same lightness+fill+word encoding as
     the report exports), a faint line behind each row anchoring the steps,
     and quiet cards: title plus one muted meta line. Row-level facts (on
     the VCE prescribed list / school-designed) sit once on the strand
     label, not on every card. */
  .matrix{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:4px}
  .tl-row{display:grid;position:relative;
       grid-template-columns:var(--label-w,118px) repeat(11,minmax(50px,1fr)) repeat(2,minmax(104px,1.7fr));
       gap:4px 6px;min-width:1020px;align-items:stretch}
  .tl-row:not(.tl-head):not(.tl-bars)::before{content:"";position:absolute;z-index:0;
       left:calc(var(--label-w,118px) + 10px);right:4px;top:50%;
       border-top:1px solid var(--line-soft)}
  .tl-head{margin-bottom:-4px}
  .tl-year{text-align:center;font-weight:700;font-size:11px;color:var(--muted);padding:2px 0}
  .tl-bars{margin-bottom:6px}
  .tl-bar{position:relative;text-align:center;padding-bottom:1px}
  .tl-bar span{font-size:8.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
       border-radius:8px;padding:0 7px;line-height:1.6;display:inline-block}
  .tl-bar[data-cur="VIC"]{border-bottom:3px solid var(--vic)}
  .tl-bar[data-cur="VIC"] span{color:var(--vic)}
  .tl-bar[data-cur="VCE"]{border-bottom:3px double var(--vce)}
  .tl-bar[data-cur="VCE"] span{background:var(--vce);color:var(--vce-ink)}
  .tl-label{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;
       background:var(--paper);padding:4px 10px 4px 0;position:sticky;left:0;z-index:2}
  .tl-strand{font-weight:700;font-size:11px;line-height:1.3;color:var(--ink)}
  .row-chip{font-size:8px;font-weight:800;letter-spacing:.4px;border-radius:8px;padding:0 5px;
       text-transform:uppercase}
  .chip-vce{border:1px solid var(--vce);color:var(--vce)}
  .chip-prog{border:1px dotted var(--prog);color:var(--prog)}
  .tl-chunk{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:3px;
       border:1px solid var(--line-soft);border-radius:8px;background:var(--bg);
       padding:7px 9px;min-height:48px;outline-offset:-2px}
  .tl-chunk.has-items{cursor:pointer;transition:border-color .12s ease,background .12s ease}
  .tl-chunk.has-items:hover{border-color:var(--accent);background:#faf5f0}
  .tl-chunk.has-items.selected{outline:2px solid var(--accent);background:#faf5f0}
  .tl-chunk.no-items{border-style:dashed;opacity:.7}
  .tl-title{font-size:11px;font-weight:600;line-height:1.3;color:var(--ink)}
  .tl-meta{font-size:8.5px;font-weight:600;letter-spacing:.2px;color:var(--muted)}

  .matrix-legend{font-size:11px;color:var(--muted);line-height:1.6;margin:14px auto 0;
       text-align:center;max-width:640px}
  .legend-vic{color:var(--vic);font-weight:800}
  .legend-vce{color:var(--vce);font-weight:800}
  .band-toggle-row{text-align:center;margin-top:10px}

  .select-toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 0;flex-wrap:wrap;gap:8px}
  .count-pill{background:var(--bg);color:var(--accent);border:1px solid var(--line);border-radius:20px;
       padding:5px 14px;font-size:12px;font-weight:600}
  .start-bar{margin-top:18px;text-align:center}.start-bar .btn{width:100%;max-width:320px}

  /* ---- task ---- */
  .progress-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
  .progress-track{height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:6px}
  .progress-fill{height:100%;width:0;background:var(--accent);transition:width .3s ease}
  .skill-tag{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:center;margin:10px 0 4px}
  .prompt{font-family:Georgia,serif;font-size:16px;text-align:center;color:var(--ink);margin-bottom:14px}
  .stimulus{font-size:24px;line-height:1.3;font-weight:700;text-align:center;background:var(--bg);
       border:1px solid var(--line);border-radius:12px;padding:24px 18px;margin-bottom:14px}
  .stimulus b{color:var(--accent);text-decoration:underline;text-underline-offset:4px}
  .stimulus rt{font-size:.5em;font-weight:400;color:var(--muted);letter-spacing:0}

  /* ---- reading pools (separate from the grammar matrix) ---- */
  .pools-section{margin-top:22px}
  .pools-group{margin-bottom:16px}
  .pools-group h3{margin-bottom:10px}
  .pools-list{display:flex;flex-direction:column;gap:6px}
  .pool-card{display:flex;justify-content:space-between;align-items:center;
       border:1px solid var(--line-soft);border-radius:8px;background:var(--paper);
       padding:10px 14px;cursor:pointer}
  .pool-card:hover{border-color:var(--accent);background:#faf5f0}
  .pool-card.selected{border-color:var(--accent);background:var(--accent)}
  .pool-card.selected .pool-name{color:#fff}
  .pool-card.selected .pool-count{background:rgba(255,255,255,.85)}
  .pool-name{font-size:13px;font-weight:600}
  .pool-count{font-size:11px;font-weight:700;color:var(--accent);background:var(--bg);
       border-radius:10px;padding:2px 8px}
  .pool-count.zero{color:var(--muted)}
  .pool-card.no-items{opacity:.65;cursor:default}
  .stimulus.gap{font-size:21px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
  .gap-input{font-family:Georgia,serif;font-size:20px;font-weight:700;text-align:center;min-width:120px;
       padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
  .gap-input:focus{outline:none;border-color:var(--accent)}
  .gap-input.correct{border-color:var(--correct);background:var(--okbg)}
  .gap-input.incorrect{border-color:var(--wrong);background:var(--badbg)}
  .cue{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .option{font-size:15px;font-weight:600;text-align:left;padding:14px 16px;border-radius:10px;
       border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
  .option:hover{border-color:var(--accent)}
  .option.chosen{border-color:var(--accent);background:#faf5f0}
  .option.correct{background:var(--okbg);border-color:var(--correct);color:var(--correct)}
  .option.incorrect{background:var(--badbg);border-color:var(--wrong);color:var(--wrong)}
  @media(max-width:480px){.options{grid-template-columns:1fr}.container{padding:14px}}
  /* ---- order (tap word/particle tiles between bank and sentence line) ---- */
  .order-line{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;min-height:54px;
       padding:12px;border:2px dashed var(--line);border-radius:10px;background:var(--bg);margin:6px 0}
  .order-line.correct{border-style:solid;border-color:var(--correct);background:var(--okbg)}
  .order-line.incorrect{border-style:solid;border-color:var(--wrong);background:var(--badbg)}
  .order-placeholder{color:var(--muted);font-size:13px;font-weight:600}
  .order-bank{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
  .order-word{padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);
       color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;transition:all .15s ease}
  .order-word:hover:not(:disabled){border-color:var(--accent)}
  .order-word.in-line{border-color:var(--accent);background:#faf5f0}
  .order-word:disabled{cursor:default;opacity:.9}
  .order-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}

  .feedback{font-size:14px;line-height:1.5;margin-top:14px;padding:14px;border-radius:10px;min-height:20px;color:var(--muted)}
  .feedback.good{background:var(--okbg);color:#234e2c}
  .feedback.bad{background:var(--badbg);color:#7a2020}
  .stub{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
  .action-row{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .exit-btn{background:none;border:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
  .exit-btn:hover{color:var(--ink)}

  /* ---- report ---- */
  .report-title{font-family:Georgia,serif;font-size:20px;text-align:center;margin-bottom:6px}
  .big-stat{font-family:Georgia,serif;font-size:46px;font-weight:700;color:var(--accent);text-align:center;line-height:1}
  .stat-label{text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px}
  #reportSummary p{text-align:center}
  .skill-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line-soft);border-radius:8px;margin-bottom:5px;font-size:13px}
  .skill-name{font-weight:600}
  .skill-score{font-weight:800;border-radius:10px;padding:1px 9px}
  .skill-score.ok{color:var(--correct);background:var(--okbg)}
  .skill-score.mid{color:#8a6d1e;background:#f6efda}
  .skill-score.low{color:var(--wrong);background:var(--badbg)}
  .remed-row{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
  .remed-row a{color:var(--accent);margin-right:8px}
  .report-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
  #copyNote{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;min-height:14px}
  .name-row{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:var(--muted)}
  .name-input{font-family:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
       background:var(--paper);color:var(--ink);min-width:180px}
  .name-input:focus{outline:none;border-color:var(--accent)}

  /* always-on build marker, faint bottom-left (canonical version = the live site) */
  .build-tag{position:fixed;left:6px;bottom:5px;z-index:70;font-family:monospace;font-size:9px;
       letter-spacing:.3px;color:var(--muted);opacity:.45;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div class="container">
<div class="lever lever-page" id="pageLever" tabindex="0" role="slider" aria-label="Language support lever for the whole page"
     aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"
     title="Pull down: kanji, kana, romaji, English. It springs back — arrow keys work too.">
  <div class="lever-cap" aria-hidden="true">ことば<br>レバー</div>
  <div class="lever-track"></div><div class="lever-stage"></div>
</div>
  <h1 class="jt-tap" data-jt="title">Japanese Grammar Hub</h1>
  <p class="subtitle jt-tap" data-jt="subtitle">Japanese grammar progression · pick skills, practise, get a report</p>

  <!-- ============ SELECT ============ -->
  <section class="screen active" id="selectScreen">
    <div class="filter-row" id="typeFilter"></div>
    <div class="matrix" id="matrix"></div>
    <p class="matrix-legend" id="matrixLegend"></p>
    <div class="band-toggle-row">
      <button class="linkbtn" id="bandToggleBtn"></button>
    </div>
    <div class="select-toolbar">
      <span class="count-pill" id="selCount">0 skills · 0 items</span>
      <span>
        <button class="linkbtn" id="selectAllBtn" data-jt="selectAll">Select all ready</button>
        <button class="linkbtn" id="selectNoneBtn" data-jt="clear">Clear</button>
      </span>
    </div>
    <div class="pools-section" id="poolsSection">
      <div id="poolsList"></div>
    </div>
    <div class="start-bar">
      <button class="btn btn-primary" id="startBtn" data-jt="start" disabled>Start practising</button>
    </div>
  </section>

  <!-- ============ TASK ============ -->
  <section class="screen" id="taskScreen">
    <div class="progress-row">
      <span id="roundText">Main round</span>
      <button class="exit-btn" id="quitBtn" data-jt="exit">Exit</button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="bar"></div></div>
    <div class="progress-row"><span></span><span id="remainText"></span></div>

    <div class="skill-tag" id="skillTag"></div>
    <div class="prompt" id="promptText"></div>
    <div id="taskArea"></div>
    <div class="feedback" id="feedback"></div>

    <div class="action-row">
      <span></span>
      <span>
        <button class="btn btn-primary" id="checkBtn" data-jt="check" disabled>Check</button>
        <button class="btn btn-primary" id="nextBtn" data-jt="next" style="display:none">Next</button>
        <span class="lever lever-mini" id="taskLever" tabindex="0" role="slider" aria-label="Language support lever for these buttons"
              aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"
              title="Pull down: kana, romaji, English for these buttons. Relaxes back over a few seconds.">
          <span class="lever-track"></span>
        </span>
      </span>
    </div>
  </section>

  <!-- ============ REPORT ============ -->
  <section class="screen" id="reportScreen">
    <div class="report-title jt-tap" data-jt="done">Session complete</div>
    <div id="reportSummary"></div>
    <div id="reportSkills"></div>
    <div id="reportRemediation"></div>
    <div class="name-row">
      <label for="studentName">Name for the report:</label>
      <input type="text" id="studentName" class="name-input" autocomplete="off" placeholder="optional">
    </div>
    <div class="report-actions">
      <button class="btn btn-ghost" id="copyBtn">Copy teacher results</button>
      <button class="btn btn-ghost" id="downloadCsvBtn">Download CSV</button>
      <button class="btn btn-ghost" id="copyTsvBtn">Copy row for sheet</button>
      <button class="btn btn-ghost" id="reviewBtn" data-jt="again">Run again</button>
      <button class="btn btn-primary" id="restartBtn" data-jt="newSel">New selection</button>
      <span class="lever lever-mini" id="reportLever" tabindex="0" role="slider" aria-label="Language support lever for these buttons"
            aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"
            title="Pull down: kana, romaji, English for these buttons. Relaxes back over a few seconds.">
        <span class="lever-track"></span>
      </span>
    </div>
    <div id="copyNote"></div>
  </section>
</div>
<div class="build-tag" aria-hidden="true">JGH build 2026-08-18c</div>

<!-- load order matters: content, then task types, then engine -->
<script src="data/skills.js"></script>
<script src="tasktypes.js"></script>
<script src="engine.js"></script>
</body>
</html>
